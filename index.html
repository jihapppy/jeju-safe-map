function getJejuRegion(name){

  if(!name) return "기타";

  // ① 공항권
  if(
    name.includes("용담1동") ||
    name.includes("용담2동") ||
    name.includes("도두동") ||
    name.includes("이호동")
  ) return "공항권";

  // ② 제주시도심권
  if(
    name.includes("연동") ||
    name.includes("노형동") ||
    name.includes("건입동") ||
    name.includes("일도1동") ||
    name.includes("일도2동") ||
    name.includes("이도1동") ||
    name.includes("이도2동") ||
    name.includes("삼도1동") ||
    name.includes("삼도2동")
  ) return "제주시도심권";

  // ③ 함덕·조천권
  if(
    name.includes("조천읍") ||
    name.includes("삼양동") ||
    name.includes("화북동")
  ) return "함덕·조천권";

  // ④ 김녕·월정권
  if(
    name.includes("구좌읍")
  ) return "김녕·월정권";

  // ⑤ 성산권
  if(
    name.includes("성산읍") ||
    name.includes("우도면")
  ) return "성산권";

  // ⑥ 애월권
  if(
    name.includes("애월읍") ||
    name.includes("외도동")
  ) return "애월권";

  // ⑦ 협재·한림권
  if(
    name.includes("한림읍")
  ) return "협재·한림권";

  // ⑧ 중문권
  if(
    name.includes("중문동") ||
    name.includes("대천동") ||
    name.includes("예래동")
  ) return "중문권";

 // ⑨ 서귀포도심권
if(
  name.includes("동홍동") ||
  name.includes("서홍동") ||
  name.includes("송산동") ||
  name.includes("정방동") ||
  name.includes("중앙동") ||
  name.includes("천지동") ||
  name.includes("대륜동") ||
  name.includes("영천동") ||
  name.includes("효돈동")
) return "서귀포도심권";

// ⑩ 서부중산간권
if(
  name.includes("안덕면") ||
  name.includes("대정읍") ||
  name.includes("한경면")
) return "서부중산간권";

// ⑪ 동부중산간권
if(
  name.includes("표선면") ||
  name.includes("남원읍")
) return "동부중산간권";

  // ⑫ 한라산권
  if(
    name.includes("아라동") ||
    name.includes("오라동") ||
    name.includes("봉개동")
  ) return "한라산권";

  return "기타";
}

  async function drawRoutes(){
    if(!customEnd && document.getElementById("endSelect").value === ""){
  alert("목적지를 선택해주세요.");
  return;
}
  if(routeLayer){
    map.removeLayer(routeLayer);
  }

  routeLayer = L.layerGroup().addTo(map);

  let startLng, startLat, startName;

  if(!customStart){
    alert("출발지를 검색하거나 현재 위치를 선택해주세요.");
    return;
}

startLng = customStart.lng;
startLat = customStart.lat;
startName = customStartName;

 let endLng, endLat, endName;

if(customEnd){
  endLng = customEnd.lng;
  endLat = customEnd.lat;
  endName = customEndName;
}else{
  const endSelect = document.getElementById("endSelect");
  const endValue = endSelect.value.split(",");
  endLng = parseFloat(endValue[0]);
  endLat = parseFloat(endValue[1]);
  endName = endSelect.options[endSelect.selectedIndex].text;
}
  lastStart = {
  lat: startLat,
  lng: startLng,
  name: startName
};

lastEnd = {
  lat: endLat,
  lng: endLng,
  name: endName
};

  if(startLng === endLng && startLat === endLat){
    alert("출발지와 목적지가 같습니다.");
    return;
  }

  document.getElementById("info").innerHTML = "경로를 불러오는 중입니다...";

  const body = {
    coordinates:[
      [startLng,startLat],
      [endLng,endLat]
    ],
    alternative_routes:{
      target_count:2,
      weight_factor:2,
      share_factor:0.6
    }
  };

  try{
    const response = await fetch(
      "https://api.openrouteservice.org/v2/directions/driving-car/geojson",
      {
        method:"POST",
        headers:{
          "Authorization":apiKey,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){
      const errorText = await response.text();
      alert("경로 불러오기 실패!\n\n"+errorText);
      return;
    }

    const data = await response.json();

    if(!data.features || data.features.length===0){
      alert("경로 데이터를 찾지 못했어요.");
      return;
    }

    const routes = data.features;

    const routeRisks = routes.map(route => {
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
      return analyzeRouteRisk(coords);
    });

    document.getElementById("info").innerHTML =
  "<span class='routePath'>"+startName+
  " <span class='arrow'>→</span> "+
  endName+"</span>";

let allCoords = [];
let routeSummaries = [];

routes.forEach((route,index)=>{
  const coords = route.geometry.coordinates.map(c=>[c[1],c[0]]);
  const distanceKm = (route.properties.summary.distance / 1000).toFixed(1);
  const durationMin = Math.round(route.properties.summary.duration / 60);
  const risk = routeRisks[index];

  routeSummaries[index] = {
    coords: coords,
    distanceKm: distanceKm,
    durationMin: durationMin,
    risk: risk
  };
});

let recommendedIndex = 0;

if(routeSummaries.length > 1){
  recommendedIndex = routeSummaries
    .map((r, i) => ({ ...r, index:i }))
    .sort((a, b) => {
      if(a.risk.score !== b.risk.score){
        return a.risk.score - b.risk.score;
      }
      if(a.durationMin !== b.durationMin){
        return a.durationMin - b.durationMin;
      }
      return Number(a.distanceKm) - Number(b.distanceKm);
    })[0].index;
}

routeSummaries.forEach((summary,index)=>{
  const coords = summary.coords;
  allCoords = allCoords.concat(coords);

  const isRecommended = index === recommendedIndex;
  const lineColor = isRecommended ? "#14b8a6" : "#ef4444";
  const labelClass = isRecommended ? "route-label-1" : "route-label-2";

  L.polyline(coords,{
    color: lineColor,
    weight:7,
    opacity:0.85
  })
  .addTo(routeLayer)
  .bindPopup(

function analyzeRouteRisk(coords){
  let passedZones = [];

  dangerZones.forEach(zone=>{
    const passed = coords.some(point=>{
      const d = getDistanceKm(point[0], point[1], zone.lat, zone.lng);
      return d <= zone.radiusKm;
    });

    if(passed){
      passedZones.push(zone);
    }
  });

  let score = passedZones.reduce((sum,z)=>sum+z.score,0);

  let level = "낮음";
  let icon = "🟢";

  if(score >= 8){
    level = "높음";
    icon = "🔴";
  }else if(score >= 4){
    level = "중간";
    icon = "🟡";
  }

  if(passedZones.length === 0){
    return {
      score:0,
      level:"낮음",
      icon:"🟢",
      zoneNames:"사고밀집권역 통과 적음",
      reasons:"비교적 단순한 경로"
    };
  }

  return {
    score:score,
    level:level,
    icon:icon,
    zoneNames:passedZones.map(z=>z.name).join(", "),
    reasons:passedZones.map(z=>z.reason).join(" / ")
  };
}

function getDistanceKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = deg2rad(lat2-lat1);
  const dLng = deg2rad(lng2-lng1);

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(deg2rad(lat1)) *
    Math.cos(deg2rad(lat2)) *
    Math.sin(dLng/2) *
    Math.sin(dLng/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function deg2rad(deg){
  return deg * (Math.PI/180);
}
