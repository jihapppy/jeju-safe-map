<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 렌터카 안전경로 비교</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
    .hodoongi{
    position:absolute;
    top:15px;
    right:15px;
    width:70px;
    height:auto;
}
    
body { margin:0; font-family:Arial,sans-serif; }
#map { width:100%; height:100vh; }

.panel {
    position:absolute;
    top:14px;
    left:14px;
    z-index:1000;
    background:rgba(255,255,255,0.96);
    padding:18px;
    border-radius:18px;
    width:360px;
    box-shadow:0 8px 24px rgba(0,0,0,0.22);
}
select, button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
    background:#0b3d2e;
    color:white;
    font-weight:bold;
    border:none;
    border-radius:12px;
}

.card {
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#f5f5f5;
}

.red { border-left:6px solid red; }
.orange { border-left:6px solid orange; }
.green { border-left:6px solid green; }

.small {
  font-size:12px;
  color:#666;
  margin-top:8px;
}

@media (max-width:768px){
  .panel {
    top:auto;
    bottom:0;
    left:0;
    width:calc(100% - 30px);
    max-height:42vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:12px 15px;
  }

  .card {
    font-size:13px;
    padding:8px;
  }

  select, button {
    padding:8px;
    font-size:13px;
  }
}

  @media (max-width:768px){

.panel{
    top:auto;
    bottom:0;
    left:0;
    width:calc(100% - 28px);
    max-height:45vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
}

}

</style>
</head>

<body>

<div class="panel">

<img src="hodoongi.png" class="hodoongi">

<b>제주 렌터카 안전경로 비교</b>

<br><br>

  출발지
  <select id="start">
 <option value="126.4936,33.5071">제주공항</option>
 <option value="126.5340,33.5160">제주항</option>
 <option value="126.4128,33.2498">중문관광단지</option>
 <option value="126.9347,33.4589">성산일출봉</option>
 <option value="126.2412,33.3938">협재해수욕장</option>
  </select>

  목적지
  <select id="end">
    <option value="126.9347,33.4589">성산일출봉</option>
<option value="126.4128,33.2498">중문관광단지</option>
<option value="126.2412,33.3938">협재해수욕장</option>
<option value="126.6695,33.5435">함덕해수욕장</option>
<option value="126.2895,33.3059">오설록</option>
<option value="126.3708,33.2896">카멜리아힐</option>
<option value="126.4625,33.3580">1100고지</option>
<option value="126.5703,33.3617">한라산 성판악</option>
<option value="126.9309,33.4242">섭지코지</option>
<option value="126.9278,33.4327">아쿠아플라넷</option>
    
  </select>

  <button onclick="drawRoutes()">안전경로 비교하기</button>

  <div id="info"></div>

  <div class="small">
    ※ 위험도는 TAAS 사고분포도와 도로특성을 종합해 낮음·중간·높음으로 구분한 참고 정보입니다.
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVkN2QwYzg1M2JlNjRhMjliZWY0ZGUxYTBhMGMzM2Q0IiwiaCI6Im11cm11cjY0In0=";

const map = L.map('map').setView([33.38,126.55],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

let routeLayer;

const dangerZones = [
  {
    name:"공항권",
    lat:33.4996,
    lng:126.5312,
    radiusKm:4,
    score:3,
    reason:"렌터카 인수 직후 초행운전, 급차선 변경, 교차로 혼잡"
  },
  {
    name:"제주시 도심권",
    lat:33.5000,
    lng:126.5200,
    radiusKm:5,
    score:3,
    reason:"도심 교차로 밀집, 보행자·차량 혼재"
  },
  {
    name:"애월해안권",
    lat:33.4628,
    lng:126.3108,
    radiusKm:5,
    score:2,
    reason:"해안경관 주시로 인한 전방주시태만 우려"
  },
  {
    name:"함덕·조천권",
    lat:33.5435,
    lng:126.6682,
    radiusKm:5,
    score:2,
    reason:"해수욕장 주변 보행자·주정차 차량 혼재"
  },
  {
    name:"김녕·월정권",
    lat:33.5560,
    lng:126.7950,
    radiusKm:5,
    score:2,
    reason:"해안도로 구간, 관광지 진출입 차량 주의"
  },
  {
    name:"성산 진입권",
    lat:33.4629,
    lng:126.9347,
    radiusKm:5,
    score:2,
    reason:"관광버스·렌터카 혼재, 교차로 통행 주의"
  },
  {
    name:"중문권",
    lat:33.2498,
    lng:126.4128,
    radiusKm:5,
    score:3,
    reason:"관광지 진출입 혼잡, 급감속·차로변경 주의"
  },
  {
    name:"서귀포 도심권",
    lat:33.2499,
    lng:126.5638,
    radiusKm:5,
    score:3,
    reason:"도심 교차로 및 보행자 혼재"
  },
  {
    name:"협재·한림권",
    lat:33.3938,
    lng:126.2412,
    radiusKm:5,
    score:2,
    reason:"해수욕장 진입부, 주정차·보행자 주의"
  },
  {
    name:"중산간도로권",
    lat:33.4200,
    lng:126.6400,
    radiusKm:12,
    score:1,
    reason:"사고밀집도는 낮으나 초행길·제한속도 주의"
  },
  {
    name:"산악도로권",
    lat:33.3580,
    lng:126.4625,
    radiusKm:8,
    score:2,
    reason:"급커브, 안개, 기상변화 주의"
  }
];

async function drawRoutes(){
  if(routeLayer){
    map.removeLayer(routeLayer);
  }

  routeLayer = L.layerGroup().addTo(map);

  const startSelect = document.getElementById("start");
  const endSelect = document.getElementById("end");

  const startName = startSelect.options[startSelect.selectedIndex].text;
  const endName = endSelect.options[endSelect.selectedIndex].text;

  const startValue = startSelect.value.split(",");
  const endValue = endSelect.value.split(",");

  const startLng = parseFloat(startValue[0]);
  const startLat = parseFloat(startValue[1]);
  const endLng = parseFloat(endValue[0]);
  const endLat = parseFloat(endValue[1]);

  if(startLng===endLng && startLat===endLat){
    alert("출발지와 목적지가 같습니다.");
    return;
  }

  document.getElementById("info").innerHTML = "경로를 불러오는 중입니다...";

  const body = {
    coordinates:[
      [startLng,startLat],
      [endLng,endLat]
    ],
    alternative_routes:{
      target_count:2,
      weight_factor:2,
      share_factor:0.6
    }
  };

  try{
    const response = await fetch(
      "https://api.openrouteservice.org/v2/directions/driving-car/geojson",
      {
        method:"POST",
        headers:{
          "Authorization":apiKey,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){
      const errorText = await response.text();
      alert("경로 불러오기 실패!\n\n"+errorText);
      return;
    }

    const data = await response.json();

    if(!data.features || data.features.length===0){
      alert("경로 데이터를 찾지 못했어요.");
      return;
    }

    const routes = data.features;

const routeRisks = routes.map(route => {
  const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
  return analyzeRouteRisk(coords);
});

let colors = [];

if(routeRisks.length === 2){

  if(routeRisks[0].score > routeRisks[1].score){

      colors = ["red","green"];

  }else if(routeRisks[0].score < routeRisks[1].score){

      colors = ["green","red"];

  }else{

      colors = ["orange","orange"];

  }

}else{

  colors = ["blue"];

}

    document.getElementById("info").innerHTML =
      "<b>"+startName+" → "+endName+"</b>";

    let allCoords = [];

    routes.forEach((route,index)=>{
      const coords = route.geometry.coordinates.map(c=>[c[1],c[0]]);
      allCoords = allCoords.concat(coords);

      const distanceKm = (route.properties.summary.distance / 1000).toFixed(1);
      const durationMin = Math.round(route.properties.summary.duration / 60);

      const risk = analyzeRouteRisk(coords);

      L.polyline(coords,{
        color:colors[index] || "blue",
        weight:7,
        opacity:0.8
      })
      .addTo(routeLayer)
      .bindPopup(
        "<b>"+(index+1)+"코스</b><br>"+
        "거리: "+distanceKm+"km<br>"+
        "예상시간: "+durationMin+"분<br>"+
        "위험도: "+risk.icon+" "+risk.level+"<br>"+
        "통과 위험권역: "+risk.zoneNames+"<br>"+
        "주요 위험요인: "+shortReasons(risk.reasons)
        );

      const card = document.createElement("div");
      card.className = "card " + (index === 0 ? "red" : "green");

card.innerHTML =
  "<b>"+(index+1)+"코스</b><br>"+
  "거리: "+distanceKm+"km<br>"+
  "예상시간(실시간 교통 미반영): "+durationMin+"분<br>"+
  "위험도: <b>"+risk.icon+" "+risk.level+"</b><br>"+
  "통과 위험권역: "+risk.zoneNames+"<br>"+
  "주요 위험요인: "+shortReasons(risk.reasons);

document.getElementById("info").appendChild(card);
    });

    L.marker([startLat,startLng])
      .addTo(routeLayer)
      .bindPopup("출발지: "+startName);

    L.marker([endLat,endLng])
      .addTo(routeLayer)
      .bindPopup("목적지: "+endName);

    map.fitBounds(L.latLngBounds(allCoords), {
      padding:[40,40]
    });

  } catch(error){
    alert("오류가 발생했어요.\n\n"+error.message);
  }
}

function analyzeRouteRisk(coords){
  let passedZones = [];

  dangerZones.forEach(zone=>{
    const passed = coords.some(point=>{
      const d = getDistanceKm(point[0], point[1], zone.lat, zone.lng);
      return d <= zone.radiusKm;
    });

    if(passed){
      passedZones.push(zone);
    }
  });

  let score = passedZones.reduce((sum,z)=>sum+z.score,0);

  let level = "낮음";
  let icon = "🟢";

  if(score >= 12){
    level = "높음";
    icon = "🔴";
  } else if(score >= 6){
    level = "중간";
    icon = "🟡";
  }

  if(passedZones.length === 0){
    return {
      score:0,
      level:"낮음",
      icon:"🟢",
      zoneNames:"사고밀집권역 통과 적음",
      reasons:"비교적 단순한 경로"
    };
  }

  return {
    score:score,
    level:level,
    icon:icon,
    zoneNames:passedZones.map(z=>z.name).join(", "),
    reasons:passedZones.map(z=>z.reason).join(" / ")
  };
}

function getDistanceKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = deg2rad(lat2-lat1);
  const dLng = deg2rad(lng2-lng1);

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(deg2rad(lat1)) *
    Math.cos(deg2rad(lat2)) *
    Math.sin(dLng/2) *
    Math.sin(dLng/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function deg2rad(deg){
  return deg * (Math.PI/180);
}

function getCardColor(level){
  if(level === "높음") return "red";
  if(level === "중간") return "orange";
  return "green";
}

  function shortReasons(reasonText){
  return reasonText
    .split("/")
    .join(",")
    .split(",")
    .map(item => item.trim())
    .filter(item => item.length > 0)
    .slice(0,3)
    .join(" · ");
}

</script>

</body>
</html>
