function getJejuRegion(name){
  if(!name) return "기타";

  if(name.includes("용담") || name.includes("도두") || name.includes("이호")) return "공항권";

  if(name.includes("연동") || name.includes("노형") || name.includes("도남") || name.includes("이도") ||
     name.includes("삼도") || name.includes("일도") || name.includes("아라") || name.includes("오라") ||
     name.includes("건입")) return "제주시 도심권";

  if(name.includes("애월읍") || name.includes("외도") || name.includes("해안")) return "애월권";

  if(name.includes("한림읍") || name.includes("한경면") || name.includes("대정읍")) return "한림·한경·대정권";

  if(name.includes("안덕면")) return "안덕·서부중산간권";

  if(name.includes("중문") || name.includes("예래") || name.includes("대천") || name.includes("강정") ||
     name.includes("대포") || name.includes("색달")) return "중문권";

  if(name.includes("동홍") || name.includes("서홍") || name.includes("천지") || name.includes("중앙") ||
     name.includes("정방") || name.includes("송산") || name.includes("효돈") || name.includes("영천") ||
     name.includes("토평") || name.includes("상효") || name.includes("대륜") || name.includes("하효"))
     return "서귀포 도심권";

  if(name.includes("남원읍")) return "남원권";

  if(name.includes("성산읍") || name.includes("표선면")) return "성산·표선권";

  if(name.includes("구좌읍")) return "구좌권";

  if(name.includes("조천읍") || name.includes("삼양") || name.includes("화북")) return "조천권";

  if(name.includes("봉개") || name.includes("영평") || name.includes("용강")) return "한라산권";

  if(name.includes("교래") || name.includes("선흘") || name.includes("대흘") || name.includes("와흘") ||
     name.includes("송당") || name.includes("수망") || name.includes("가시") || name.includes("녹산"))
     return "동부중산간권";

  return "기타";
}

fetch("jeju_regions.geojson")
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: function(feature){
        const name =
          feature.properties.adm_nm ||
          feature.properties.name ||
          feature.properties.EMD_NM ||
          feature.properties.SIG_KOR_NM ||
          "";

        const region = getJejuRegion(name);
        const risk = regionRisk[region];

        return {
  color:"#6b705c",
  weight:2,
  fillColor: risk ? risk.color : "#cccccc",
  fillOpacity: risk ? 0.85 : 0.2
};
      },

      onEachFeature: function(feature, layer){
        const name =
          feature.properties.adm_nm ||
          feature.properties.name ||
          feature.properties.EMD_NM ||
          feature.properties.SIG_KOR_NM ||
          "";

        const region = getJejuRegion(name);
        const risk = regionRisk[region];
        const tipData = regionTips[region];

        const warnings = tipData ? tipData.warnings : ["해당 권역의 교통상황에 유의하세요."];
        const safeTip = tipData ? tipData.tip : "전방주시와 감속운전을 실천하세요.";

        layer.bindPopup(`
          <div style="min-width:230px; line-height:1.6;">
           <b style="font-size:17px;color:#073f31;">
${risk ? risk.level : "미분류"} 위험지역
</b><br>
<span style="font-size:15px;font-weight:bold;">
${region}
</span>
            <span style="color:#666;">${name}</span><br><br>

            <b>⚠ 이런 점을 주의하세요</b><br>
            ${warnings.map(w => "• " + w).join("<br>")}

            <br><br>

            <b>💡 안전운전 Tip</b><br>
            ${safeTip}
          </div>
        `);
      }
    }).addTo(map);
  });

function useCurrentLocation(){
  if(!navigator.geolocation){
    alert("현재 위치 기능을 지원하지 않는 브라우저입니다.");
    return;
  }

  document.getElementById("info").innerHTML = "현재 위치를 확인하는 중입니다...";

  navigator.geolocation.getCurrentPosition(
    function(position){
      customStart = {
        lng: position.coords.longitude,
        lat: position.coords.latitude
      };

      customStartName = "현재 위치";
      document.getElementById("info").innerHTML = "출발지가 현재 위치로 설정되었습니다.";
    },
    function(){
      alert("현재 위치를 가져오지 못했어요. 위치 권한을 허용해주세요.");
      document.getElementById("info").innerHTML = "";
    }
  );
}

function analyzeRouteRisk(coords){
  let passedZones = [];

  dangerZones.forEach(zone=>{
    const passed = coords.some(point=>{
      const d = getDistanceKm(point[0], point[1], zone.lat, zone.lng);
      return d <= zone.radiusKm;
    });

    if(passed){
      passedZones.push(zone);
    }
  });

  let score = passedZones.reduce((sum,z)=>sum+z.score,0);

  let level = "낮음";
  let icon = "🟢";

  if(score >= 8){
    level = "높음";
    icon = "🔴";
  }else if(score >= 4){
    level = "중간";
    icon = "🟡";
  }

  if(passedZones.length === 0){
    return {
      score:0,
      level:"낮음",
      icon:"🟢",
      zoneNames:"사고밀집권역 통과 적음",
      reasons:"비교적 단순한 경로"
    };
  }

  return {
    score:score,
    level:level,
    icon:icon,
    zoneNames:passedZones.map(z=>z.name).join(", "),
    reasons:passedZones.map(z=>z.reason).join(" / ")
  };
}

function getDistanceKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = deg2rad(lat2-lat1);
  const dLng = deg2rad(lng2-lng1);

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(deg2rad(lat1)) *
    Math.cos(deg2rad(lat2)) *
    Math.sin(dLng/2) *
    Math.sin(dLng/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function deg2rad(deg){
  return deg * (Math.PI/180);
}

function getCardColorByLine(color){
  if(color === "red") return "red";
  if(color === "green") return "green";
  return "blue";
