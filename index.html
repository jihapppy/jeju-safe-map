<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>제주 렌터카 안전경로 안내</title>

<meta name="description" content="사고데이터 기반으로 더 안전한 제주 여행 경로를 추천합니다.">

<meta property="og:title" content="제주 렌터카 안전경로 안내">
<meta property="og:description" content="사고데이터 기반으로 더 안전한 제주 여행 경로를 추천합니다.">
<meta property="og:image" content="https://jihapppy.github.io/jeju-safe-map/thumbnail.png">
<meta property="og:url" content="https://jihapppy.github.io/jeju-safe-map/">
<meta property="og:type" content="website">

<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="제주 렌터카 안전경로 안내">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial,sans-serif; }
#map { width:100%; height:100vh; }

.panel {
  position:absolute; top:14px; left:14px; z-index:1000;
  background:rgba(255,255,255,0.96); padding:16px;
  border-radius:18px; width:360px;
  box-shadow:0 8px 24px rgba(0,0,0,0.22);
}

  .address-result{
  margin-top:6px;
  padding:9px;
  border:1px solid #d5ddd8;
  border-radius:10px;
  background:#f7faf8;
  font-size:13px;
  cursor:pointer;
}

.address-result:hover{
  background:#e9f3ee;
}
.hodoongi{
  position:absolute; top:10px; right:15px;
  width:60px; height:auto;
}

h2{
  margin:0 70px 12px 0;
  font-size:21px;
  color:#0b3d2e;
}

label{
  display:block;
  margin-top:8px;
  font-size:13px;
  font-weight:bold;
}

select, input, button {
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  box-sizing:border-box;
}

button {
  background:#0b3d2e;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

  .address-row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.address-row input{
  flex:1;
}

.mini-btn{
  width:80px;
  background:#0b3d2e;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
}
  
.sub-btn{
  background:#f1f5f3;
  color:#0b3d2e;
  border:1px solid #b7c7bf;
}

.card {
  margin-top:10px;
  padding:12px;
  border-radius:14px;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  line-height:1.55;
  font-size:14px;
}

.red { border-left:7px solid #e53935; }
.green { border-left:7px solid #43a047; }
.blue { border-left:7px solid #1e88e5; }

.small {
  font-size:11px;
  color:#666;
  margin-top:10px;
  line-height:1.4;
}

@media (max-width:768px){
  .panel{
    top:auto; bottom:0; left:0;
    width:calc(100% - 28px);
    max-height:48vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:14px;
  }

  .hodoongi{ width:52px; }
  h2{ font-size:19px; margin-right:60px; }
  .card{ font-size:13px; }
}
</style>
</head>

<body>

<div class="panel">
  <img src="hodoongi.png" class="hodoongi">

  <h2>🚗 제주 렌터카 안전경로 안내</h2>

 <label>출발지 설정</label>

<button class="sub-btn" onclick="useCurrentLocation()">
📍 현재 위치 사용
</button>

<div class="address-row">
  <input id="addressInput" type="text" placeholder="예: 제주신라호텔, 메종글래드 제주">
  <button class="mini-btn" onclick="searchAddress()">검색</button>
</div>

<div id="addressResults"></div>
  

<label>또는 주요 출발지 선택</label>

<select id="startSelect">
  <option value="">-- 주요 출발지 선택 --</option>
  <option value="126.4936,33.5071">제주공항</option>
  <option value="126.4128,33.2498">중문관광단지</option>
  <option value="126.9347,33.4589">성산일출봉</option>
  <option value="126.2412,33.3938">협재해수욕장</option>
<option value="126.6206,33.3841">한라산 성판악</option>
</select>

  <label>목적지 선택</label>
  <select id="endSelect">
    <option value="126.9347,33.4589">성산일출봉</option>
    <option value="126.4128,33.2498">중문관광단지</option>
    <option value="126.2412,33.3938">협재해수욕장</option>
    <option value="126.6695,33.5435">함덕해수욕장</option>
    <option value="126.2895,33.3059">오설록</option>
    <option value="126.3708,33.2896">카멜리아힐</option>
    <option value="126.4625,33.3580">1100고지</option>
<option value="126.6206,33.3841">한라산 성판악</option>
    <option value="126.7146,33.4912">비자림</option>
    <option value="126.6267,33.4386">사려니숲길</option>
  </select>

  <button onclick="drawRoutes()">안전경로 분석하기</button>

  <div id="info"></div>

  <div class="small">
    ※ 본 서비스는 사고분포 및 도로환경 정보를 참고하여 안전한 경로 선택을 지원하기 위한 참고용 정보입니다.
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVkN2QwYzg1M2JlNjRhMjliZWY0ZGUxYTBhMGMzM2Q0IiwiaCI6Im11cm11cjY0In0=";

const map = L.map('map').setView([33.38,126.55],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

let routeLayer;
let customStart = null;
let customStartName = null;
  
let lastStart = null;
let lastEnd = null;
  let recommendedRoute = 0;
  
const dangerZones = [
  { name:"공항권", lat:33.4996, lng:126.5312, radiusKm:4, score:3, reason:"렌터카 인수 직후 초행운전, 급차선 변경" },
  { name:"제주시 도심권", lat:33.5000, lng:126.5200, radiusKm:5, score:3, reason:"도심 교차로 밀집, 보행자·차량 혼재" },
  { name:"함덕·조천권", lat:33.5435, lng:126.6682, radiusKm:5, score:2, reason:"해수욕장 주변 보행자·주정차 차량 혼재" },
  { name:"김녕·월정권", lat:33.5560, lng:126.7950, radiusKm:5, score:2, reason:"해안도로 구간, 관광지 진출입 차량 주의" },
  { name:"성산 진입권", lat:33.4629, lng:126.9347, radiusKm:5, score:2, reason:"관광버스·렌터카 혼재, 교차로 통행 주의" },
  { name:"중문권", lat:33.2498, lng:126.4128, radiusKm:5, score:3, reason:"관광지 진출입 혼잡, 급감속·차로변경 주의" },
  { name:"협재·한림권", lat:33.3938, lng:126.2412, radiusKm:5, score:2, reason:"해수욕장 진입부, 주정차·보행자 주의" },
  { name:"중산간도로권", lat:33.4200, lng:126.6400, radiusKm:12, score:1, reason:"초행길·제한속도 주의" },
  { name:"산악도로권", lat:33.3580, lng:126.4625, radiusKm:8, score:2, reason:"급커브, 안개, 기상변화 주의" },
  { name:"서부 관광권", lat:33.3059, lng:126.2895, radiusKm:6, score:2, reason:"관광지 진입부, 급감속·주정차 주의" }
];

function useCurrentLocation(){
  if(!navigator.geolocation){
    alert("현재 위치 기능을 지원하지 않는 브라우저입니다.");
    return;
  }

  document.getElementById("info").innerHTML = "현재 위치를 확인하는 중입니다...";

  navigator.geolocation.getCurrentPosition(
    function(position){
      customStart = {
        lng: position.coords.longitude,
        lat: position.coords.latitude
      };
      customStartName = "현재 위치";
      document.getElementById("startSelect").value = "";
      document.getElementById("info").innerHTML = "출발지가 현재 위치로 설정되었습니다.";
    },
    function(){
      alert("현재 위치를 가져오지 못했어요. 위치 권한을 허용해주세요.");
      document.getElementById("info").innerHTML = "";
    }
  );
}

async function searchAddress(){
  const address = document.getElementById("addressInput").value.trim();
  const resultBox = document.getElementById("addressResults");

  if(address === ""){
    alert("주소나 장소명을 입력해주세요.");
    return;
  }

  resultBox.innerHTML = "주소를 검색하는 중입니다...";

  try{
    const url =
      "https://api.openrouteservice.org/geocode/search?api_key=" +
      apiKey +
     "&text=" + encodeURIComponent(address + " 제주") +
"&boundary.rect.min_lon=126.10" +
"&boundary.rect.min_lat=33.10" +
"&boundary.rect.max_lon=126.98" +
"&boundary.rect.max_lat=33.60" +
"&size=5";

    const response = await fetch(url);
    const data = await response.json();

    if(!data.features || data.features.length === 0){
      resultBox.innerHTML = "검색 결과가 없습니다.";
      return;
    }

    resultBox.innerHTML = "";

    data.features.forEach(feature => {
      const coords = feature.geometry.coordinates;
      const name =
        feature.properties.label ||
        feature.properties.name ||
        "주소 후보";

      const div = document.createElement("div");
      div.className = "address-result";
      div.innerHTML = name;

      div.onclick = function(){
        customStart = {
          lng: coords[0],
          lat: coords[1]
        };

        customStartName = name;

        document.getElementById("startSelect").value = "";
        document.getElementById("addressInput").value = name;
        resultBox.innerHTML = "";

        document.getElementById("info").innerHTML =
          "출발지가 '" + name + "'(으)로 설정되었습니다.";
      };

      resultBox.appendChild(div);
    });

  }catch(error){
    alert("주소 검색 중 오류가 발생했어요.\n\n" + error.message);
  }
}
  

async function drawRoutes(){
  if(routeLayer){
    map.removeLayer(routeLayer);
  }

  routeLayer = L.layerGroup().addTo(map);

  let startLng, startLat, startName;

  if(customStart){
    startLng = customStart.lng;
    startLat = customStart.lat;
    startName = customStartName;
  }else{
    const startSelect = document.getElementById("startSelect");
    const startValue = startSelect.value.split(",");
    startLng = parseFloat(startValue[0]);
    startLat = parseFloat(startValue[1]);
    startName = startSelect.options[startSelect.selectedIndex].text;
  }

  const endSelect = document.getElementById("endSelect");
  const endValue = endSelect.value.split(",");
  const endLng = parseFloat(endValue[0]);
  const endLat = parseFloat(endValue[1]);
  const endName = endSelect.options[endSelect.selectedIndex].text;
  lastStart = {
  lat: startLat,
  lng: startLng,
  name: startName
};

lastEnd = {
  lat: endLat,
  lng: endLng,
  name: endName
};

  if(startLng === endLng && startLat === endLat){
    alert("출발지와 목적지가 같습니다.");
    return;
  }

  document.getElementById("info").innerHTML = "경로를 불러오는 중입니다...";

  const body = {
    coordinates:[
      [startLng,startLat],
      [endLng,endLat]
    ],
    alternative_routes:{
      target_count:2,
      weight_factor:2,
      share_factor:0.6
    }
  };

  try{
    const response = await fetch(
      "https://api.openrouteservice.org/v2/directions/driving-car/geojson",
      {
        method:"POST",
        headers:{
          "Authorization":apiKey,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){
      const errorText = await response.text();
      alert("경로 불러오기 실패!\n\n"+errorText);
      return;
    }

    const data = await response.json();

    if(!data.features || data.features.length===0){
      alert("경로 데이터를 찾지 못했어요.");
      return;
    }

    const routes = data.features;

    const routeRisks = routes.map(route => {
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
      return analyzeRouteRisk(coords);
    });

    let colors = [];

    if(routeRisks.length === 2){
      if(routeRisks[0].score > routeRisks[1].score){
        colors = ["red","green"];
      }else if(routeRisks[0].score < routeRisks[1].score){
        colors = ["green","red"];
      }else{
        colors = ["blue","blue"];
      }
    }else{
      colors = ["blue"];
    }

    document.getElementById("info").innerHTML =
      "<b>"+startName+" → "+endName+"</b>";

    let allCoords = [];

routes.forEach((route,index)=>{
  const coords = route.geometry.coordinates.map(c=>[c[1],c[0]]);
  allCoords = allCoords.concat(coords);

  const distanceKm = (route.properties.summary.distance / 1000).toFixed(1);
  const durationMin = Math.round(route.properties.summary.duration / 60);

  const risk = routeRisks[index];

  L.polyline(coords,{
    color:colors[index] || "blue",
    weight:7,
    opacity:0.85
  })
  .addTo(routeLayer)
  .bindPopup(
    "<b>"+(index+1)+"코스</b><br>"+
    "거리: "+distanceKm+"km<br>"+
    "예상시간: "+durationMin+"분<br>"+
    "위험도: "+risk.icon+" "+risk.level+"<br>"+
    "통과 위험권역: "+risk.zoneNames
  );

  const card = document.createElement("div");
  card.className = "card " + getCardColorByLine(colors[index]);

  card.innerHTML =
    "<b>"+(index+1)+"코스</b><br>"+
    "거리: "+distanceKm+"km<br>"+
    "예상시간(실시간 교통 미반영): "+durationMin+"분<br>"+
    "위험도: <b>"+risk.icon+" "+risk.level+"</b><br>"+
    "통과 위험권역: "+risk.zoneNames+"<br>"+
    "주요 위험요인: "+risk.reasons;

  document.getElementById("info").appendChild(card);
});

let recommendedIndex = 0;

if(routeRisks.length === 2){
  if(routeRisks[0].score > routeRisks[1].score){
    recommendedIndex = 1;
  }else{
    recommendedIndex = 0;
  }
}

const guide = document.createElement("div");
guide.className = "card green";
guide.innerHTML =
  "<b>🟢 추천 안전경로</b><br>" +
  (recommendedIndex + 1) +
  "코스는 상대적으로 위험도가 낮아 추천되는 경로입니다.";

document.getElementById("info").appendChild(guide);

const safeBtn = document.createElement("button");
safeBtn.innerHTML = "🟢 네이버지도 길안내";
safeBtn.onclick = function(){
  openNaverMap(recommendedIndex);
};

document.getElementById("info").appendChild(safeBtn);
    const tmapBtn = document.createElement("button");

tmapBtn.innerHTML = "🔵 TMAP 길안내";

tmapBtn.onclick = function(){
  openTmap();
};

document.getElementById("info").appendChild(tmapBtn);

  const kakaoBtn = document.createElement("button");

kakaoBtn.innerHTML = "🟡 카카오내비 길안내";

kakaoBtn.onclick = function(){
  openKakaoNavi();
};

document.getElementById("info").appendChild(kakaoBtn);
    const notice = document.createElement("div");

notice.style.fontSize = "13px";
notice.style.color = "#666";
notice.style.marginTop = "10px";

notice.innerHTML =
  "* 가장 안전한 추천 경로로 안내됩니다.";

document.getElementById("info").appendChild(notice);
    L.marker([startLat,startLng])
      .addTo(routeLayer)
      .bindPopup("출발지: "+startName);

    L.marker([endLat,endLng])
      .addTo(routeLayer)
      .bindPopup("목적지: "+endName);

    map.fitBounds(L.latLngBounds(allCoords), {
      padding:[40,40]
    });

  }catch(error){
    alert("오류가 발생했어요.\n\n"+error.message);
  }
}

function analyzeRouteRisk(coords){
  let passedZones = [];

  dangerZones.forEach(zone=>{
    const passed = coords.some(point=>{
      const d = getDistanceKm(point[0], point[1], zone.lat, zone.lng);
      return d <= zone.radiusKm;
    });

    if(passed){
      passedZones.push(zone);
    }
  });

  let score = passedZones.reduce((sum,z)=>sum+z.score,0);

  let level = "낮음";
  let icon = "🟢";

  if(score >= 8){
    level = "높음";
    icon = "🔴";
  }else if(score >= 4){
    level = "중간";
    icon = "🟡";
  }

  if(passedZones.length === 0){
    return {
      score:0,
      level:"낮음",
      icon:"🟢",
      zoneNames:"사고밀집권역 통과 적음",
      reasons:"비교적 단순한 경로"
    };
  }

  return {
    score:score,
    level:level,
    icon:icon,
    zoneNames:passedZones.map(z=>z.name).join(", "),
    reasons:passedZones.map(z=>z.reason).join(" / ")
  };
}

function getDistanceKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = deg2rad(lat2-lat1);
  const dLng = deg2rad(lng2-lng1);

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(deg2rad(lat1)) *
    Math.cos(deg2rad(lat2)) *
    Math.sin(dLng/2) *
    Math.sin(dLng/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function deg2rad(deg){
  return deg * (Math.PI/180);
}

function getCardColorByLine(color){
  if(color === "red") return "red";
  if(color === "green") return "green";
  return "blue";
}
  function openNaverMap(routeIndex){
  if(!lastStart || !lastEnd){
    alert("먼저 안전경로를 분석해주세요.");
    return;
  }

  const appname = "https://jihapppy.github.io/jeju-safe-map";

  const url =
    "nmap://route/car?" +
    "slat=" + lastStart.lat +
    "&slng=" + lastStart.lng +
    "&sname=" + encodeURIComponent(lastStart.name) +
    "&dlat=" + lastEnd.lat +
    "&dlng=" + lastEnd.lng +
    "&dname=" + encodeURIComponent(lastEnd.name) +
    "&appname=" + encodeURIComponent(appname);

  window.location.href = url;
}
  function openTmap(){

  if(!lastEnd){
    alert("먼저 안전경로를 분석해주세요.");
    return;
  }

  const url =
    "tmap://route?" +
    "goalx=" + lastEnd.lng +
    "&goaly=" + lastEnd.lat +
    "&goalname=" + encodeURIComponent(lastEnd.name);

  window.location.href = url;

}
</script>

</body>
</html>
